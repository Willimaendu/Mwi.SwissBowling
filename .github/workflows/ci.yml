name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore with vulnerability audit
        run: dotnet restore Mwi.SwissBowling.slnx
      - name: Build
        id: build
        run: dotnet build Mwi.SwissBowling.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Mwi.SwissBowling.UnitTests -c Release --no-build --logger trx --results-directory TestResults/unit
      - name: Check Docker availability
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: docker
        run: docker info
      - name: PostgreSQL integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.docker.outcome == 'success' }}
        run: dotnet test tests/Mwi.SwissBowling.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults/integration
      - name: Dependency inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet list Mwi.SwissBowling.slnx package --include-transitive --format json > dependency-inventory.json
      - name: Build API container
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.docker.outcome == 'success' }}
        run: docker build --file src/Mwi.SwissBowling.Api/Dockerfile --tag swissbowling-api:ci .
      - name: Build web container
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.docker.outcome == 'success' }}
        run: docker build --file src/Mwi.SwissBowling.Web/Dockerfile --tag swissbowling-web:ci .
      - name: Upload verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/**/*.trx
            dependency-inventory.json
          if-no-files-found: warn
          retention-days: 14
