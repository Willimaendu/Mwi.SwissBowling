name: Publish containers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify release source
        run: |
          dotnet restore Mwi.SwissBowling.slnx
          dotnet build Mwi.SwissBowling.slnx -c Release --no-restore
          dotnet test tests/Mwi.SwissBowling.UnitTests -c Release --no-build
          dotnet test tests/Mwi.SwissBowling.IntegrationTests -c Release --no-build
      - name: Build and publish immutable source-revision tags
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for component in Api Web; do
            image="ghcr.io/$owner/swissbowling-${component,,}:$GITHUB_SHA"
            docker build --file "src/Mwi.SwissBowling.$component/Dockerfile" --tag "$image" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
            docker push "$image"
          done
